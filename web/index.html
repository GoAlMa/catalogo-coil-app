<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Técnico de Defectos COIL - Fernando Arias</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="COIL App">

</head>
<body>

 <header>
        <div>
            <h1>Catálogo Técnico de Defectos COIL</h1>
            <p class="subtitle">Fernando Arias | Registro de defectos, posibles causas y soluciones recomendadas</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <!-- Botón discreto para iniciar sesión como Fernando -->
            <button id="btnAccesoFernando" onclick="pedirAccesoFernando()" class="btn-ghost">Acceso de edición</button>

            <!-- Botón de nuevo defecto protegido con la clase admin-only -->
            <a href="nuevo.html" class="btn-primary admin-only" style="text-decoration: none; display: none;">+ Nuevo Defecto</a>
        </div>

 </header>

<div class="filter-bar" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
    <input type="text" id="searchInput" placeholder="Buscar por título, causa, solución..." style="flex: 1; min-width: 200px;">

    <!-- Desplegable dinámico de Categorías -->
    <select id="categoryFilter">
        <option value="">Todas las Categorías</option>
    </select>

    <!-- Desplegable dinámico de Subcategorías -->
    <select id="subCategoryFilter">
        <option value="">Todas las Subcategorías</option>
    </select>

    <button id="btnLimpiarFiltros" class="btn-ghost" style="display:none;">Limpiar filtros</button>
</div>

<div class="result-count" id="resultCount"></div>

<main>
    <div class="grid-container" id="gridDefectos"></div>
</main>

<!-- MODAL DE DETALLE -->
<div id="modalDetalle" class="modal">
    <div class="modal-content">
        <span class="close-btn" role="button" aria-label="Cerrar" onclick="cerrarModal('modalDetalle')">&times;</span>
        <img id="detailImg" src="" alt="Fotografía del defecto">
        <span id="detailBadge" class="badge">Categoría</span>
        <h2 id="detailTitle">Título del Defecto</h2>

        <div class="info-block causa">
            <strong>Causa:</strong>
            <p id="detailCausa"></p>
        </div>

        <div class="info-block solucion">
            <strong>Solución Recomendada:</strong>
            <p id="detailSolucion"></p>
        </div>

        <div class="modal-actions">
            <button id="btnEditarModal" class="btn-warning admin-only">Editar Defecto</button>
            <button id="btnBorrarModal" class="btn-danger admin-only">Borrar Defecto</button>
        </div>
    </div>
</div>

<!-- MODAL DE EDICIÓN -->
<div id="modalEditar" class="modal">
    <div class="modal-content">
        <span class="close-btn" role="button" aria-label="Cerrar" onclick="cerrarModal('modalEditar')">&times;</span>
        <h2>Editar Defecto</h2>
        <form id="editForm">
            <input type="hidden" id="editId">

            <label>Título / Nombre de la Falla:</label>
            <input type="text" id="editTitulo" required>

            <label>Categoría:</label>
            <input type="text" id="editCategoria" placeholder="Ej. Superficie y Metal Base" required>

            <label>Subcategoría:</label>
            <input type="text" id="editSubcategoria" placeholder="Ej. Cráteres y Pintura" required>

            <label>Cambiar Fotografía (Opcional):</label>
            <input type="file" id="editFoto" accept="image/*">

            <label>Causa:</label>
            <textarea id="editCausa" rows="3" required></textarea>

            <label>Solución:</label>
            <textarea id="editSolucion" rows="3" required></textarea>

            <button type="submit" class="btn-primary" style="width:100%; margin-top:20px;">Guardar Cambios</button>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
