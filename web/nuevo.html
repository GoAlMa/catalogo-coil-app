<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Defecto - COIL Fernando Arias</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="COIL App">

</head>
<body>

<header>
    <div>
        <h1>Registrar Nuevo Defecto</h1>
        <p class="subtitle">Catálogo Técnico COIL – Fernando Arias</p>
    </div>
    <a href="index.html" class="btn-secondary" style="text-decoration: none;">&larr; Volver al Catálogo</a>
</header>

<main class="formulario">
    <form id="defectoForm">
        <label>Título / Nombre de la Falla:</label>
        <input type="text" id="formTitulo" required>

        <label>Categoría:</label>
        <input type="text" id="categoria" list="listaCategoriasSugeridas" placeholder="Ej. Superficie y Metal Base" required>
        <datalist id="listaCategoriasSugeridas">

            <!-- Aquí puedes poner opcionalmente alguna categoría por defecto si quieres -->

        </datalist>

        <label>Subcategoría:</label>
        <input type="text" id="subcategoria" list="listaSubcategoriasSugeridas" placeholder="Ej. Cráteres y Pintura" required>
        <datalist id="listaSubcategoriasSugeridas">

            <!-- Aquí puedes poner opcionalmente alguna subcategoría por defecto si quieres -->

        </datalist>

        <label>Fotografía del Defecto:</label>
        <input type="file" id="formFoto" accept="image/*" required>

        <label>Causa:</label>
        <textarea id="formCausa" rows="3" required></textarea>

        <label>Solución:</label>
        <textarea id="formSolucion" rows="3" required></textarea>

        <button type="submit" class="btn-primary" style="width:100%; margin-top:20px;">Guardar y Publicar</button>
    </form>
</main>

<script src="nuevo.js"></script>
</body>
</html>
